# Packaging + tooling configuration. The app can be run straight from source
# (python zx-next-unite.py), packaged with PyInstaller (see CLAUDE.md), or
# installed from PyPI (pipx install zx-next-unite).

# ── packaging: pip / pipx / PyPI ─────────────────────────────────────────────
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "zx-next-unite"
# MUST match ZX_NEXT_UNITE_VERSION in zxnu_config.py — the release workflow
# gates on it (same rule as the git tag).
version = "9.4.6"
description = "GUI toolbox for the ZX Spectrum Next: SD-card/HDF image explorer, NextSync Wi-Fi file sync + Remote Explorer & HTTP bridge, and built-in software browsing via GetIt, ZXDB and zxArt"
readme = "README.md"
license = "MIT"
authors = [{ name = "Julien Clauzel" }]
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.5.1",
]
keywords = ["zx-spectrum-next", "zx-spectrum", "nextsync", "cspect", "retrocomputing"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Emulators",
    "Topic :: Utilities",
]

[project.optional-dependencies]
# Everything the Settings toggles can enable: retro pygame views, the itch.io
# tab, Recycle-Bin deletes and the NextSync HTTP bridge.
full = ["pygame-ce>=2.5.0", "itch-dl", "Send2Trash", "flask"]

[project.urls]
Homepage = "https://github.com/jclauzel/ZX-Next-Unite"
Documentation = "https://github.com/jclauzel/ZX-Next-Unite/wiki"
Changelog = "https://github.com/jclauzel/ZX-Next-Unite/releases"
Issues = "https://github.com/jclauzel/ZX-Next-Unite/issues"

[project.gui-scripts]
zx-next-unite = "zxnu_app:main"

[project.scripts]
# The standalone Sync4/Sync5 command-line server rides along.
nextsync5 = "nextsync5:main"

[tool.setuptools]
# Flat top-level modules (the strangler layout, see CLAUDE.md) — shipped
# as-is. rc_backgrounds is the pyside6-rcc-generated Qt resource module.
py-modules = [
    "zxnu_app",
    "zxnu_main",
    "zxnu_config",
    "zxnu_api",
    "zxnu_workers",
    "zxnu_media",
    "zxnu_gallery",
    "zxnu_getit_pane",
    "zxnu_zxdb_pane",
    "zxnu_zxart_pane",
    "zxnu_unite_pane",
    "zxnu_settings_pane",
    "zxnu_nextsync_pane",
    "zxnu_sdcard_explorer",
    "zxnu_remote_explorer",
    "zxnu_http_bridge",
    "zxnu_i18n",
    "zxnu_itchio",
    "zxnu_pygame",
    "rc_backgrounds",
    "nextsync5",
]

# ── ruff: lint + format ──────────────────────────────────────────────────────
# Deliberately PERMISSIVE: the goal is that NEW code stays clean without
# churning the existing 26k-line monolith. `ruff check .` must stay green on
# the whole repo (it gates nothing otherwise); tighten rules gradually as the
# strangler refactor (zxnu_sdcard_explorer.py etc.) shrinks the legacy code.
# Format new modules with `ruff format <file>` — do NOT format the legacy
# files wholesale, the diff churn would bury real changes.
[tool.ruff]
line-length = 200          # legacy code has very long lines; keep new code sane by taste
target-version = "py310"
extend-exclude = [
    "rc_backgrounds.py",   # generated by pyside6-rcc — never lint or format
    "env",                 # in-place virtualenv some setups use
    "nextsync/sync/z88dk", # z88dk C project (build scripts only)
]

[tool.ruff.lint]
# Ruff's default set (E4/E7/E9 + F pyflakes) plus bugbear's likely-bug checks.
select = ["E4", "E7", "E9", "F", "B"]
ignore = [
    # Legacy-style allowances (pervasive in the monolith; revisit per-module
    # as code moves out of zx-next-unite.py):
    "E401",   # import os, sys on one line
    "E402",   # imports not at the top of the file (deliberate lazy imports)
    "E701",   # multiple statements on one line (compact guard clauses)
    "E702",   # statements separated by semicolons
    "E703",   # trailing semicolons
    "E722",   # bare except (used as last-ditch UI guards)
    "E741",   # ambiguous single-letter names (for l in INIT_LOG, ...)
    "F401",   # unused imports (some are star-import re-exports — do NOT
              # auto-remove from zxnu_config: consumers import * from it)
    "F403",   # from zxnu_config import * (the app's config surface)
    "F405",   # names that may come from a star import
    "F541",   # f-strings without placeholders
    "F841",   # assigned-but-unused locals (often kept for readability)
    "B007",   # unused loop variable (idiomatic in walk loops here)
    "B023",   # closure captures loop variable (Qt connects are call-now)
    "B905",   # zip() without strict= (py3.13 code predates the idiom)
]

[tool.ruff.lint.per-file-ignores]
# The test suite prints PASS/FAIL lines and monkey-patches Qt on purpose.
"tests/*" = ["E501"]
