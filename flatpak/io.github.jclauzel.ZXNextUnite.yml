# Flatpak manifest for ZX Next Unite.
#
# Local build (Linux, flatpak + flatpak-builder + the flathub remote):
#   flatpak-builder --force-clean --user --install-deps-from=flathub \
#       --repo=repo builddir flatpak/io.github.jclauzel.ZXNextUnite.yml
#   flatpak build-bundle repo zx-next-unite.flatpak io.github.jclauzel.ZXNextUnite
#
# CI: .github/workflows/flatpak.yml builds this manifest and uploads the
# .flatpak bundle as a workflow artifact (workflow_dispatch or a v* tag).
#
# NOTE (Flathub submission): Flathub forbids `type: dir` sources — swap the
# app module's source for a git source pinned to a release tag + commit
# before submitting (see flatpak/README.md).
app-id: io.github.jclauzel.ZXNextUnite
runtime: org.kde.Platform
runtime-version: '6.8'
sdk: org.kde.Sdk
base: io.qt.PySide.BaseApp
base-version: '6.8'
command: zx-next-unite

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  # Catalogue browsing, NextSync/HTTP-bridge servers (inbound TCP 2048
  # included) and the hdfmonkey/emulator downloads.
  - --share=network
  # SD images, sync roots and drag-and-drop live anywhere in the user's
  # home; hdfmonkey (a child process) needs direct path access, so the
  # per-file document portal is not enough.
  - --filesystem=home
  # Route hdfg.cfg + downloads/ to the XDG data dir instead of the
  # (read-only) install dir — same switch the PyPI entry point flips.
  - --env=ZX_NEXT_UNITE_MODE=installed
  # Lets the app launch the user's chosen emulator on the host through
  # `flatpak-spawn --host` — the "Launch MAME via Flatpak" setting runs
  # `flatpak run org.mamedev.MAME`, which cannot exist inside the sandbox.
  - --talk-name=org.freedesktop.Flatpak

cleanup-commands:
  # The PySide BaseApp ships a trim script; tolerate its absence so a
  # BaseApp layout change cannot break the build.
  - sh -c '[ -x /app/cleanup-BaseApp.sh ] && /app/cleanup-BaseApp.sh || true'

modules:
  # The four optional extras the app detects at runtime (their Settings
  # toggles stay greyed out when missing): pygame-ce (retro modes + the
  # Alien Floyd's tab), itch-dl (the itch.io tab, incl. its CSpect+hdfmonkey
  # install), Flask (the NextSync HTTP bridge) and Send2Trash (recycle-bin
  # deletes). Vendored as pinned wheels because Flathub builds are offline;
  # regenerate the list with pip's --report resolver against the runtime's
  # Python (currently 3.12) when bumping versions.
  - name: python3-extras
    buildsystem: simple
    build-commands:
      - pip3 install --no-index --find-links="file://${PWD}" --prefix=${FLATPAK_DEST}
        pygame-ce itch-dl flask send2trash
